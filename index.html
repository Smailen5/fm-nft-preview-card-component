<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
    </style>
  </head>

  <body>
    <div class="card-container">
      <!---------- Card ---------->

      <div id="card">
        <div id="card-img">
          <div class="image-overlay" id="my-element">
            <img src="images/icon-view.svg" class="view-icon" />
          </div>
          <img src="images/image-equilibrium.jpg" class="img" id="img" />
        </div>

        <!---------- Section ---------->

        <div id="section">
          <h3 class="mb-10">Equilibrium #3429</h3>

          <p class="mb-20">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <!---------- Dati ---------->

          <div class="info-row">
            <div class="stat mb-20">
              <div class="icon-wrapper">
                <img src="images/icon-ethereum.svg" />
              </div>
              <span>0.041 ETH</span>
            </div>

            <div id="data" class="stat mb-20">
              <div class="icon-wrapper">
                <img src="images/icon-clock.svg" />
              </div>
              <span>3 days left</span>
            </div>
          </div>

          <!---------- Div block ---------->

          <div class="divider mb-20"></div>

          <!---------- Crediti ---------->
          <div class="attribution">
            <div class="avatar-wrapper">
              <img src="images/image-avatar.png" alt="" />
            </div>
            <div class="text">
              <p>Creation of <strong>Jules Wyvern</strong></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!---------- Script ---------->

    <script>
      // Seleziona l'elemento da aggiungere la classe
      let nftImage = document.getElementById('img');

      nftImage.addEventListener('mouseover', function () {
        // Aggiungi la classe all'overlay
        let overlayElement = document.querySelector('#my-element');
        overlayElement.classList.add('active');
      });

      nftImage.addEventListener('mouseout', function () {
        // Rimuovi la classe dall'overlay
        let overlayElement = document.querySelector('#my-element');
        overlayElement.classList.remove('active');
      });
    </script>
  </body>
</html>
